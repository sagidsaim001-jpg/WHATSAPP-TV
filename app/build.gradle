plugins {
    id 'com.android.application'
}
android {
    namespace 'com.saji.whatsapptv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.saji.whatsapptv'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
